when@dev:
nelmio_api_doc:
    areas:
        path_patterns:
            - ^/auth
            - ^/api(?!/doc$)
    documentation:
        info:
            title: 'API Documentation'
            version: '1.0.0'

        paths:
            /auth/login:
                post:
                    tags:
                        - Authentication
                    summary: User authentication (Get JWT token)
                    requestBody:
                        required: true
                        content:
                            application/json:
                                schema:
                                    type: object
                                    properties:
                                        email:
                                            type: string
                                            example: user@example.com
                                        password:
                                            type: string
                                            example: secret123
                    responses:
                        '200':
                            description: Successful authentication
                            content:
                                application/json:
                                    schema:
                                        type: object
                                        properties:
                                            token:
                                                type: string
                                                example: eyJhbGciOiJIUzI1NiIsIn...
                        '401':
                            description: Invalid email or password
            /auth/refresh:
                post:
                    tags:
                        - Authentication
                    summary: Refresh expired JWT access token
                    requestBody:
                        required: true
                        content:
                            application/json:
                                schema:
                                    type: object
                                    properties:
                                        refresh_token:
                                            type: string
                                            example: "7a3b8c9d..."
                    responses:
                        '200':
                            description: New JWT and Refresh Token pair generated successfully
                        '401':
                            description: Invalid or expired refresh token

            /auth/logout:
                post:
                    tags:
                        - Authentication
                    summary: Securely log out and revoke refresh token from MongoDB
                    requestBody:
                        required: true
                        content:
                            application/json:
                                schema:
                                    type: object
                                    properties:
                                        refresh_token:
                                            type: string
                                            example: "7a3b8c9d..."
                    responses:
                        '204':
                            description: Successfully logged out, token deleted from MongoDB
                        '401':
                            description: Missing or invalid token

